name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck (optional)
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x plugins/claude-grok-offload/scripts/*.sh \
              plugins/claude-grok-offload/scripts/lib/*.sh \
              plugins/claude-grok-offload/tests/test-*.sh
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck || true
            if command -v shellcheck >/dev/null 2>&1; then
              shellcheck -x plugins/claude-grok-offload/scripts/*.sh \
                plugins/claude-grok-offload/scripts/lib/*.sh \
                plugins/claude-grok-offload/tests/test-*.sh || true
            else
              echo "shellcheck unavailable — skipped (optional)"
            fi
          fi

      - name: Make scripts executable
        run: |
          chmod +x plugins/claude-grok-offload/scripts/*.sh \
            plugins/claude-grok-offload/scripts/lib/*.sh \
            plugins/claude-grok-offload/tests/test-*.sh

      - name: Run unit tests
        run: |
          set -e
          for t in plugins/claude-grok-offload/tests/test-*.sh; do
            echo "==> $t"
            bash "$t"
          done

      - name: Strip / personal-marker gate
        run: |
          bash plugins/claude-grok-offload/tests/test-strip.sh
